<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMS - Authentication</title>
  <link rel="icon" type="image/jpeg" href="bms_logo.jpg">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <img src="bms_logo.jpg" alt="BMS Logo" class="auth-logo">
        <h1>BMS</h1>
        <p>Sign in to your account or create a new one</p>
      </div>

      <!-- Auth Mode Switcher Tabs -->
      <div class="auth-tabs">
        <button type="button" class="tab-btn active" id="tab-login">Login</button>
        <button type="button" class="tab-btn" id="tab-register">Register</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="login-email">Email or Username</label>
          <input type="text" id="login-email" required placeholder="Enter email or username">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required placeholder="Enter password">
        </div>
        <button type="submit" class="submit-btn">Sign In</button>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="auth-form hidden">
        <div class="form-group">
          <label for="register-username">Username</label>
          <input type="text" id="register-username" required placeholder="Choose a username">
        </div>
        <div class="form-group">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" required placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" required placeholder="Create a password">
        </div>
        <button type="submit" class="submit-btn">Create Account</button>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
